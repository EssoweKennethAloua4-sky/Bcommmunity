services:
  - type: web
    name: bakhita-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: python manage.py migrate --noinput
    dockerCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/vivant/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bakhita-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bakhita-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: TRUSTED_PROXY_IPS
        value: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Bakhita Community <no-reply@example.org>
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_URL
        value: gestion-bakhita-x7/

  - type: worker
    name: bakhita-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: bakhita-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bakhita-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bakhita-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ALLOWED_HOSTS
      - key: SITE_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: SITE_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: FRONTEND_URL
      - key: TRUSTED_PROXY_IPS
        value: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_BUCKET
      - key: R2_PUBLIC_DOMAIN
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_PUBLIC_DOMAIN
      - key: ONESIGNAL_APP_ID
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ONESIGNAL_APP_ID
      - key: ONESIGNAL_REST_API_KEY
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ONESIGNAL_REST_API_KEY
      - key: FCM_SERVICE_ACCOUNT_JSON
        fromService:
          type: web
          name: bakhita-api
          envVarKey: FCM_SERVICE_ACCOUNT_JSON
      - key: BREVO_SMTP_LOGIN
        fromService:
          type: web
          name: bakhita-api
          envVarKey: BREVO_SMTP_LOGIN
      - key: BREVO_SMTP_PASSWORD
        fromService:
          type: web
          name: bakhita-api
          envVarKey: BREVO_SMTP_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: DEFAULT_FROM_EMAIL
      - key: ADMIN_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ADMIN_URL

  - type: worker
    name: bakhita-beat
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: bakhita-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bakhita-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bakhita-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ALLOWED_HOSTS
      - key: SITE_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: SITE_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: FRONTEND_URL
      - key: TRUSTED_PROXY_IPS
        value: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_BUCKET
      - key: R2_PUBLIC_DOMAIN
        fromService:
          type: web
          name: bakhita-api
          envVarKey: R2_PUBLIC_DOMAIN
      - key: ONESIGNAL_APP_ID
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ONESIGNAL_APP_ID
      - key: ONESIGNAL_REST_API_KEY
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ONESIGNAL_REST_API_KEY
      - key: FCM_SERVICE_ACCOUNT_JSON
        fromService:
          type: web
          name: bakhita-api
          envVarKey: FCM_SERVICE_ACCOUNT_JSON
      - key: BREVO_SMTP_LOGIN
        fromService:
          type: web
          name: bakhita-api
          envVarKey: BREVO_SMTP_LOGIN
      - key: BREVO_SMTP_PASSWORD
        fromService:
          type: web
          name: bakhita-api
          envVarKey: BREVO_SMTP_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: DEFAULT_FROM_EMAIL
      - key: ADMIN_URL
        fromService:
          type: web
          name: bakhita-api
          envVarKey: ADMIN_URL

  - type: keyvalue
    name: bakhita-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
